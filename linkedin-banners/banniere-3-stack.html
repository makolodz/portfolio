<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bannière 3 — Stack</title>
<style>
  @font-face { font-family: 'Big Shoulders Display'; src: url('../node_modules/@fontsource-variable/big-shoulders-display/files/big-shoulders-display-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Archivo'; src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2'); font-weight: 500; }

  :root { --deep:#0B1416; --deep-2:#111E21; --deep-3:#1A2B2F; --foam:#ECEFE9; --mist:#9AADA9; --volt:#D4FF3A; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1584px; height: 396px; background: var(--deep); overflow: hidden; }

  .banner { position: relative; width: 1584px; height: 396px; background: var(--deep); color: var(--foam); font-family: 'Archivo', sans-serif; overflow: hidden; }

  /* Nom : zone haute, à droite de la photo de profil */
  .name { position: absolute; left: 470px; top: 34px; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 112px; line-height: .9; text-transform: uppercase; white-space: nowrap; }
  .name span { color: var(--volt); }

  .sub { position: absolute; left: 474px; top: 160px; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; color: var(--mist); }

  /* Trois casquettes, en bandes horizontales en bas */
  .cols { position: absolute; left: 470px; right: 80px; bottom: 44px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .col { background: var(--deep-2); border: 1px solid var(--deep-3); border-top: 4px solid var(--volt); padding: 18px 22px 16px; }
  .col h2 { font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 800; font-size: 30px; text-transform: uppercase; line-height: 1; }
  .col p { margin-top: 12px; font-size: 20px; line-height: 1.35; color: var(--foam); }
  .col p span { color: var(--mist); }
</style>
</head>
<body>
<div class="banner">
  <p class="name">Maxime <span>Kolodziejczyk</span></p>
  <p class="sub">Fullstack &amp; DevOps · Disponible freelance &amp; CDI</p>

  <div class="cols">
    <div class="col">
      <h2>Conception</h2>
      <p>Ateliers utilisateurs · Wireframes · Figma</p>
    </div>
    <div class="col">
      <h2>Développement</h2>
      <p>Astro · React · Symfony · T3 Stack</p>
    </div>
    <div class="col">
      <h2>Déploiement</h2>
      <p>Git · CI/CD · Docker · <span>mise en prod</span></p>
    </div>
  </div>
</div>
</body>
</html>
