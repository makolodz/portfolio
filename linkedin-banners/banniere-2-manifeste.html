<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bannière 2 — Manifeste</title>
<style>
  @font-face { font-family: 'Big Shoulders Display'; src: url('../node_modules/@fontsource-variable/big-shoulders-display/files/big-shoulders-display-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Archivo'; src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2'); font-weight: 500; }

  :root { --deep:#0B1416; --deep-2:#111E21; --foam:#ECEFE9; --mist:#9AADA9; --volt:#D4FF3A; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1584px; height: 396px; background: var(--deep); overflow: hidden; }

  .banner { position: relative; width: 1584px; height: 396px; background: var(--deep); color: var(--foam); font-family: 'Archivo', sans-serif; overflow: hidden; }

  /* Grand monogramme XK en filigrane, coupé par le bord droit */
  .giant { position: absolute; right: -60px; top: -40px; width: 620px; height: 620px; opacity: .95; }
  .giant svg { width: 100%; height: 100%; }

  /* Bande de séparation, comme une ligne de rivière */
  .rule { position: absolute; left: 470px; top: 0; width: 6px; height: 100%; background: linear-gradient(to bottom, transparent, var(--volt) 35%, var(--volt) 65%, transparent); }

  .content { position: absolute; left: 510px; top: 0; bottom: 0; right: 560px; display: flex; flex-direction: column; justify-content: center; }

  .label { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: var(--mist); }

  .quote { margin-top: 16px; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 800; font-size: 66px; line-height: .95; text-transform: uppercase; }
  .quote span { color: var(--volt); }

  .foot { margin-top: 26px; display: flex; gap: 28px; align-items: baseline; white-space: nowrap; font-size: 24px; color: var(--foam); }
  .foot b { font-weight: 700; }
  .foot i { font-style: normal; color: var(--mist); }

  .chip { display: inline-block; margin-top: 26px; align-self: flex-start; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: .04em; background: var(--volt); color: var(--deep); padding: 10px 20px; border-radius: 4px; }
</style>
</head>
<body>
<div class="banner">
  <div class="giant" aria-hidden="true">
    <svg viewBox="0 0 2559 2559">
      <rect width="2559" height="2559" rx="512" fill="none" stroke="#1A2B2F" stroke-width="36"/>
      <g transform="translate(352.0 479.5)">
        <path fill="#1A2B2F" transform="translate(-23.0 1600.0) scale(1 -1)" d="M23 0 273 832 29 1600H323L427 1226L453 952H493L519 1226L619 1600H913L681 822L919 0H625L519 394L493 688H453L427 394L317 0Z"/>
        <path fill="#1A2B2F" transform="translate(879.0 1600.0) scale(1 -1)" d="M80 0V1600H400L396 1212L342 854H396L492 1212L636 1600H964L698 942L976 0H672L498 610L386 368V0Z"/>
      </g>
    </svg>
  </div>

  <div class="rule"></div>

  <div class="content">
    <p class="label">Développeur fullstack &amp; DevOps</p>
    <p class="quote">Concevoir, livrer, <span>faire vivre</span> des outils utiles.</p>
    <p class="foot"><b>Maxime Kolodziejczyk</b> <i>Le Puy-en-Velay · Clermont-Ferrand</i></p>
  </div>
</div>
</body>
</html>
