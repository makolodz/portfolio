<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bannière 1 — Identité</title>
<style>
  @font-face { font-family: 'Big Shoulders Display'; src: url('../node_modules/@fontsource-variable/big-shoulders-display/files/big-shoulders-display-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Archivo'; src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2'); font-weight: 500; }

  :root { --deep:#0B1416; --deep-2:#111E21; --foam:#ECEFE9; --mist:#9AADA9; --volt:#D4FF3A; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1584px; height: 396px; background: var(--deep); overflow: hidden; }

  .banner { position: relative; width: 1584px; height: 396px; background: var(--deep); color: var(--foam); font-family: 'Archivo', sans-serif; overflow: hidden; }

  /* Lignes de courant (eau vive) */
  .flow { position: absolute; inset: 0; width: 100%; height: 100%; }

  .content { position: absolute; left: 470px; top: 0; bottom: 0; right: 120px; display: flex; flex-direction: column; justify-content: center; }

  .tag { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; color: var(--volt); display: flex; align-items: center; gap: 14px; }
  .tag::before { content: ''; width: 36px; height: 3px; background: var(--volt); }

  h1 { font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 128px; line-height: .9; text-transform: uppercase; letter-spacing: -.005em; margin-top: 18px; }
  h1 span { color: var(--volt); }

  .role { margin-top: 22px; font-size: 34px; font-weight: 500; color: var(--foam); }
  .role em { font-style: normal; color: var(--mist); }

  .mark { position: absolute; right: 120px; top: 70px; width: 256px; height: 256px; }
  .mark svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="banner">
  <!-- Lignes d'écoulement, en filigrane -->
  <svg class="flow" viewBox="0 0 1584 396" preserveAspectRatio="none" aria-hidden="true">
    <g fill="none" stroke="#9AADA9" stroke-width="1.4" opacity=".22">
      <path d="M0 80 C 300 40, 420 140, 760 110 S 1200 60, 1584 110"/>
      <path d="M0 150 C 280 110, 470 220, 800 190 S 1250 130, 1584 180"/>
      <path d="M0 230 C 300 190, 520 300, 860 270 S 1300 210, 1584 260"/>
      <path d="M0 310 C 320 280, 560 370, 900 340 S 1320 290, 1584 330"/>
    </g>
  </svg>

  <div class="content">
    <p class="tag">Disponible · Freelance &amp; CDI</p>
    <h1>Maxime <span>Kolodziejczyk</span></h1>
    <p class="role">Développeur fullstack <em>&amp;</em> DevOps</p>
  </div>

  <div class="mark">
    <svg viewBox="0 0 2559 2559" aria-hidden="true">
      <rect width="2559" height="2559" rx="512" fill="#D4FF3A"/>
      <g transform="translate(352.0 479.5)">
        <path fill="#0B1416" transform="translate(-23.0 1600.0) scale(1 -1)" d="M23 0 273 832 29 1600H323L427 1226L453 952H493L519 1226L619 1600H913L681 822L919 0H625L519 394L493 688H453L427 394L317 0Z"/>
        <path fill="#0B1416" transform="translate(879.0 1600.0) scale(1 -1)" d="M80 0V1600H400L396 1212L342 854H396L492 1212L636 1600H964L698 942L976 0H672L498 610L386 368V0Z"/>
      </g>
    </svg>
  </div>
</div>
</body>
</html>
